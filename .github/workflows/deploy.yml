name: Build and Deploy

# Сборка Docker-образа в GitHub Actions (4 vCPU) вместо VPS (2 vCPU).
# На VPS уезжает готовый образ: там только docker pull + up — нагрузка на
# CPU сервера в момент деплоя падает с минут сборки до секунд.
on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  # ВАЖНО: только строчные буквы — GHCR не принимает заглавные в имени образа.
  # (github.repository = macmerf/health-app-2 — с заглавной, поэтому хардкод.)
  IMAGE_NAME: macmerf/health-app-2

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            NEXT_PUBLIC_APP_URL=https://zabotapsy.ru
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          # Кеш слоёв: повторные сборки занимают минуты, а не десятки минут
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        env:
          # Эфемерный токен (живёт только пока идёт job) — им логинимся в GHCR на VPS,
          # чтобы docker compose pull мог скачать приватный образ.
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GHCR_TOKEN
          script: |
            set -e
            cd /opt/zabota
            git pull
            echo "$GHCR_TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull web
            docker compose up -d
            docker image prune -f
