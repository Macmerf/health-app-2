<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Забота — нет соединения</title>
  <style>
    :root {
      --bg: #FAF9F7;
      --text: #2D2C2A;
      --muted: #6B6A68;
      --primary: #7C9A8E;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1C1B1A;
        --text: #E8E6E3;
        --muted: #A09E9A;
        --primary: #8FADA0;
      }
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Onest', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      max-width: 360px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .icon {
      width: 72px;
      height: 72px;
      border-radius: 24px;
      background: color-mix(in srgb, var(--primary) 15%, transparent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
    }
    h1 { font-size: 20px; font-weight: 600; }
    p { font-size: 14px; line-height: 1.6; color: var(--muted); }
    button {
      margin-top: 8px;
      padding: 12px 20px;
      border: none;
      border-radius: 14px;
      background: var(--primary);
      color: #fff;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="icon" aria-hidden="true">🌿</div>
    <h1>Соединение пропало</h1>
    <p>Твои записи и планы сохранились на устройстве и доступны без интернета. Вернись в приложение, когда появится связь.</p>
    <button onclick="location.reload()">Попробовать снова</button>
  </main>
</body>
</html>
