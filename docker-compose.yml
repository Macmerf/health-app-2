# ============================================================
# «Забота» — compose для Timeweb Cloud Server (VPS).
# Volume `app-data` сохраняет SQLite между передеплоями.
# Caddy ставится отдельно на сервере (см. deploy/timeweb-caddy.md)
# и терминирует HTTPS на домене, проксируя на :3000.
# ============================================================
services:
  web:
    # Образ собирается в GitHub Actions и публикуется в GHCR (см. deploy.yml).
    # VPS больше не собирает Next.js на своих 2 vCPU — только pull + restart.
    # Имя должно совпадать с IMAGE_NAME в deploy.yml (только строчные буквы!).
    image: ghcr.io/macmerf/health-app-2:latest
    container_name: zabota
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - DATA_DIR=/app/data
      # Node heap ограничен явно: 4 ГБ RAM на VPS — не даём Node съесть всё.
      - NODE_OPTIONS=--max-old-space-size=512
      # Остальные env (YooKassa, цены) — в .env на сервере,
      # подключаются через env_file ниже. Не коммить .env в git!
    env_file:
      - .env
    volumes:
      - app-data:/app/data
    deploy:
      resources:
        limits:
          # Жёсткий потолок контейнера: приложение лёгкое (SQLite, без тяжёлого SSR),
          # 768 МБ достаточно с запасом; остальная RAM — ОС, Caddy и page cache.
          memory: 768M
    healthcheck:
      # Лёгкий internal-пробер: fetch доступен в Node 24 без зависимостей.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/payments').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  app-data:
